# Render Blueprint: Docker web service + managed Postgres.
services:
  - type: web
    name: equaroots-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: equaroots-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: CAL_WEBHOOK_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        value: darshan.hy1722@gmail.com,shweta.singh.533@gmail.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
databases:
  - name: equaroots-db
    plan: basic-256mb
