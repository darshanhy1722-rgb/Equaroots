name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: equaroots, POSTGRES_PASSWORD: equaroots, POSTGRES_DB: equaroots_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U equaroots" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test (uses the runner's Chrome for PDF rendering)
        run: PUPPETEER_EXECUTABLE_PATH=$(which google-chrome) npm test
